<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTK FSIA</title>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; margin: 18px; }
    /* main container: left column for controls, right area for plot/results */
    .main { display:flex; gap:18px; align-items:flex-start; margin-bottom:12px; }
    .controls { display:flex; flex-direction:column; gap:12px; flex:0 0 320px; }
    .plot_area { flex:1 1 auto; min-width:200px; }
    .control { display:flex; flex-direction:column; }
    label { font-size:13px; margin-bottom:4px; }
  input[type="number"] { width:100px; padding:6px; }
  .range { width:100%; margin-top:6px; }
    #results { margin-top:8px; font-size:14px; }
   /* make plot responsive to window size: use fluid width with a sensible max-width
     and a viewport-relative height so the plot scales nicely on narrow/tall windows */
   #plot { width:100%; height:60vh; min-height:350px; box-sizing:border-box; }
    .small { font-size:12px; color:#555 }

  /* Responsive: stack controls above plot on narrow viewports */
  @media (max-width: 900px) {
    .main { flex-direction:column; }
    .controls { flex: 0 0 auto; width:100%; }
    .plot_area { width:100%; }
    input[type="number"] { width:100%; box-sizing:border-box; }
  }
  </style>
</head>
<body>
  <h2>FS from an ideal arch</h2>

  <div class="main">
    <div class="controls">
    <div class="control">
      <div style="display:flex;gap:8px;align-items:center;">
        <label for="L" style="margin:0;white-space:nowrap;">L (mm)</label>
        <input id="L" type="number" step="0.1" value="7.0" min="1" max="50" style="width:80px;">
        <input id="L_range" class="range" type="range" min="1" max="50" step="0.1" value="7.0">
      </div>
    </div>
    <div class="control">
      <div style="display:flex;gap:8px;align-items:center;">
        <label for="a" style="margin:0;white-space:nowrap;">a (deg)</label>
        <input id="a" type="number" step="0.1" value="0" min="-80" max="80" style="width:80px;">
        <input id="a_range" class="range" type="range" min="-80" max="80" step="0.1" value="0">
      </div>
    </div>
    <div class="control">
      <div style="display:flex;gap:8px;align-items:center;">
        <label for="b" style="margin:0;white-space:nowrap;">b (deg)</label>
        <input id="b" type="number" step="0.1" value="0" min="-80" max="80" style="width:80px;">
        <input id="b_range" class="range" type="range" min="-80" max="80" step="0.1" value="0">
      </div>
    </div>
    <div style="display:flex;gap:12px;">
      <div class="control" style="flex:1;">
        <label for="material">Material</label>
        <select id="material">
          <option>Stainless Steel</option>
          <option>Beta Titanium</option>
          <option>Nickel Titanium</option>
        </select>
      </div>
      <div class="control" style="flex:1;">
        <label for="cross_section">Cross Section</label>
        <select id="cross_section">
          <option>0.009 Round</option>
        <option>0.010 Round</option>
        <option>0.012 Round</option>
        <option>0.014 Round</option>
        <option>0.016 Round</option>
        <option>0.017 Round</option>
        <option>0.018 Round</option>
        <option>0.019 Round</option>
        <option>0.020 Round</option>
        <option>0.021 Round</option>
        <option>0.022 Round</option>
        <option>0.010x0.020 Rect</option>
        <option>0.016x0.022 Rect</option>
        <option>0.017x0.025 Rect</option>
        <option>0.018x0.025 Rect</option>
        <option>0.019x0.025 Rect</option>
        <option>0.021x0.025 Rect</option>
          <option>0.022x0.028 Rect</option>
        </select>
      </div>
    </div>
    <div class="control">
      <div style="display:flex;gap:8px;align-items:center;">
        <label for="E" style="margin:0;white-space:nowrap;">E (GPa)</label>
        <input id="E" type="number" step="0.1" value="207.0" min="14.5" max="207.0" style="width:80px;">
        <input id="E_range" class="range" type="range" min="14.5" max="207.0" step="0.1" value="207.0">
      </div>
    </div>
    <div class="control">
      <div style="display:flex;gap:8px;align-items:center;">
        <label for="I" style="margin:0;white-space:nowrap;">I (×10⁻¹⁵ m⁴)</label>
        <input id="I" type="number" step="0.01" value="1.34" min="0.13" max="10.34" style="width:80px;">
        <input id="I_range" class="range" type="range" min="0.13" max="10.34" step="0.01" value="1.34">
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">
  <button id="plotBtn" style="display:none;">Plot</button>
  <label class="small" style="display:none;"><input id="autoCalc" type="checkbox" checked> Auto-calc</label>
  <label class="small"><input id="showEq" type="checkbox" checked> Show equation</label>
    </div>
    </div>

    <div class="plot_area">
      <div id="results"></div>
      <div id="plot"></div>
    </div>
  </div>

  <script src="BTK_21.09K.js"></script>
</body>
</html>
